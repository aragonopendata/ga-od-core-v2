{% load i18n %}
<form method="get" class="manager-filters">
  <label for="id_q">{% trans "Search" %}</label>
  <input type="text" id="id_q" name="q" value="{{ search_query }}">
  <label for="id_enabled">{% trans "Enabled" %}</label>
  <select id="id_enabled" name="enabled">
    <option value="all" {% if enabled_filter == "all" %}selected{% endif %}>{% trans "All" %}</option>
    <option value="1" {% if enabled_filter == "1" %}selected{% endif %}>{% trans "Yes" %}</option>
    <option value="0" {% if enabled_filter == "0" %}selected{% endif %}>{% trans "No" %}</option>
  </select>
  <button type="submit" class="manager-button">{% trans "Filter" %}</button>
</form>
