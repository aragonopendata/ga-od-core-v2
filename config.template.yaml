common_config:
  secret_key: foo
  allowed_hosts:
    - 'your-domain.com'
    - 'localhost'
  csrf_trusted_origins:
    - 'https://your-domain.com'
  debug: true
  cache_ttl: 300
  # Optional. Log one `download_timing` line per download/preview request (default: true).
  download_timing_log: true
  # Optional. Limits for large downloads (GET of /download only; never HEAD or preview). Every key is optional.
  # A download is large when its resource had >= heavy_rows rows in its last whole download (one without filters,
  # like, fields, limit or offset; a resource never downloaded whole is not large unless listed) or its id is in
  # heavy_resource_ids, and the request has no `limit` or a `limit` >= heavy_rows. Uses PostgreSQL advisory locks of
  # the config database, so it does nothing on other databases (SQLite).
  #   - An identical large download already running gets 429 Too Many Requests.
  #   - No free slot (max_per_resource for the same resource, max_total overall) gets 503 Service Unavailable.
  # Both answers carry a Retry-After header (retry_after seconds).
  download_limits:
    enabled: true             # false switches the limits off
    heavy_rows: 100000
    max_per_resource: 2       # simultaneous large downloads of one resource (1-16)
    max_total: 4              # simultaneous large downloads in total
    retry_after: 120          # seconds
    heavy_resource_ids: []    # resources always treated as large, e.g. [3146]
  # Optional. Rows fetched per network round trip by Oracle cursors (default: 5000).
  # Higher values cut round trips on large tables at the cost of memory per cursor.
  oracle_arraysize: 5000
  # Optional. Send `download` responses in CSV/SCSV, JSON (without `indent` or geometry) and XML while the rows
  # are being read instead of building the whole file first (default: true). false returns to building the whole
  # file in memory. XLSX, YAML, GeoJSON, JSON with `indent` and `preview` are always built whole.
  download_streaming: true
  # Optional. Rows read, converted and sent per block of a streamed download (default: 1000).
  download_block_rows: 1000
  # Optional. Seconds the Django config-DB connection is kept open between requests
  # (default: 60; 0 = close after every request). PostgreSQL connections ~= workers x threads.
  conn_max_age: 60
  # Optional. Redis for the Django caches: the cache_page responses of /gaodcore-transports/ (a Redis error is
  # served as a cache miss) and the shared state of the internal://transports/... connectors (a Redis error is a
  # 503). Without it, the page cache stays in the django_cache table and the internal connectors keep their state
  # in each worker. Docker Compose starts it as redis-gaodcore.
  redis_url: redis://redis-gaodcore:6379/0
  databases:
    default:
      ENGINE: django.db.backends.postgresql
      NAME: foo
projects:
  transport:
    aragon:
      user: foo
      password: foo
      customer_id: 0
      base_url: foo
      endpoints:
        vehicles: foo
        drivers: foo
        live_position_latest: foo
        vehicle_journey_history_latest: foo
        distance_travelled: foo
    zaragoza:
      base_url: foo
      max_concurrency: 5
      endpoints:
        lines: foo
        stops: foo
        routes: foo
        stops_route: foo
        arrival_time: foo
        notices: foo
        origins: foo
        destinations: foo
        lines_ori_des: foo
        times_route: foo
        exp_ori_des: foo
        stops_ori_des: foo
        arrival_ori_des: foo
        sae: foo
      # Optional (these are the defaults). Used by the connectors internal://transports/zaragoza/stops and
      # internal://transports/zaragoza/arrival_time, served in process from state shared through the Redis "transports"
      # cache instead of through the public URL.
      internal:
        stops_max_age_seconds: 3600          # the shared stops copy is fresh for this long
        stops_max_stale_seconds: 86400       # after that it is still served (and refreshed by one request) for this long
        stops_retry_after_seconds: 10        # Retry-After of the 503 when there is no usable copy
        stops_timeout_seconds: 10            # timeout of the call to the stops endpoint
        stops_lock_seconds: 30               # expiry of the refresh lock; must exceed the timeout
        stops_min_ratio: 0.5                 # a new copy with fewer rows than this share of the previous one is rejected
        refresh_backoff_min_seconds: 60      # wait after a failed refresh, doubled on each failure...
        refresh_backoff_max_seconds: 900     # ...up to this
        arrivals_ttl_seconds: 60             # arrivals of a stop (with or without arrivals) are reused for this long
        arrivals_unknown_ttl_seconds: 300    # an unknown stop code is reused for this long
        arrivals_max_stale_seconds: 30       # an expired value may still be served this long when no call is possible
        arrivals_error_ttl_seconds: 10       # after a failed call, no new call for the same stop for this long
        arrivals_max_concurrency: 2          # simultaneous calls to arrival_time among all the workers
        arrivals_timeout_seconds: 3          # bound of one call to arrival_time (locks expire 5 s after it)
        arrivals_busy_retry_after_seconds: 2 # Retry-After of the 503 when no call is possible or the cache is down
        arrivals_max_bytes: 1000000          # larger answers are rejected as invalid
        arrivals_aggregate_ttl_seconds: 300  # arrivals of every stop (query without a stop) are reused for this long
        arrivals_aggregate_max_stale_seconds: 600  # an expired aggregate may still be served this long
        arrivals_aggregate_lock_seconds: 60  # one worker rebuilds at a time; must exceed arrivals_timeout_seconds + 5
        arrivals_aggregate_error_ttl_seconds: 30  # after a rebuild where every stop failed, no new attempt for this long
        arrivals_aggregate_retry_after_seconds: 5 # Retry-After of the 503 while another worker rebuilds
