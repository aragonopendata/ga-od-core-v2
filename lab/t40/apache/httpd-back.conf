# Apache "back": HTTP/1.1 hacia Gunicorn con timeout=240 como en produccion.
# Con -D DEFLATE (LAB_BACK_MODE=DEFLATE) comprime las respuestas si el cliente envia Accept-Encoding: gzip.
ServerRoot "/usr/local/apache2"
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
User daemon
Group daemon
ServerName apache-back
ServerAdmin lab@example.invalid
ErrorLog /proc/self/fd/2
LogLevel warn
# %D microsegundos; %X estado de la conexion al terminar (X = abortada antes de completar la respuesta,
# + = keep-alive, - = cerrada tras la respuesta); enc = Content-Encoding de la respuesta; %b bytes.
LogFormat "apache-back %h %t \"%r\" %>s bytes=%b dur_us=%D conn=%X enc=%{Content-Encoding}o" lab
CustomLog /proc/self/fd/1 lab
<Directory />
    Require all denied
</Directory>
<IfDefine DEFLATE>
    AddOutputFilterByType DEFLATE text/csv text/plain text/html application/json application/xml
    DeflateCompressionLevel 6
</IfDefine>
ProxyRequests Off
ProxyPass /GA_OD_Core/ http://app:6001/GA_OD_Core/ timeout=240
ProxyPassReverse /GA_OD_Core/ http://app:6001/GA_OD_Core/
